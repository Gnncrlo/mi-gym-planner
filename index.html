const plan=[{day:'Lunes',title:'Push A',muscle:'Pecho · hombros · tríceps',ex:[['Press de banca','3 × 8–10'],['Press inclinado mancuernas','3 × 10–12'],['Press militar','3 × 8–10'],['Elevaciones laterales','3 × 12–15'],['Tríceps en polea','3 × 12']]},{day:'Martes',title:'Pull A',muscle:'Espalda · bíceps',ex:[['Jalón al pecho','3 × 10'],['Remo sentado','3 × 10'],['Face pull','3 × 12–15'],['Curl bíceps','3 × 10–12'],['Curl martillo','2 × 12']]},{day:'Miércoles',title:'Legs A',muscle:'Cuádriceps · femorales · core',ex:[['Sentadilla goblet','3 × 10'],['Prensa de piernas','3 × 12'],['Peso muerto rumano','3 × 10'],['Curl femoral','3 × 12'],['Plancha','3 × 30 s']]},{day:'Jueves',title:'Push B',muscle:'Pecho · hombros · tríceps',ex:[['Press inclinado','3 × 10'],['Aperturas','3 × 12'],['Press hombros mancuernas','3 × 10'],['Elevación lateral','3 × 15'],['Extensión tríceps','3 × 12']]},{day:'Viernes',title:'Pull B',muscle:'Espalda · bíceps',ex:[['Remo con mancuerna','3 × 10'],['Jalón agarre neutro','3 × 12'],['Pájaros posteriores','3 × 12'],['Curl barra','3 × 10'],['Curl concentrado','2 × 12']]},{day:'Sábado',title:'Legs B',muscle:'Piernas · glúteos · core',ex:[['Peso muerto rumano','3 × 10'],['Zancadas','3 × 10'],['Extensión cuádriceps','3 × 12'],['Elevación talones','3 × 15'],['Crunch','3 × 15']]},{day:'Domingo',title:'Descanso',muscle:'Recuperación',ex:[]}];
const defaults={tab:'inicio',day:(new Date().getDay()+6)%7,week:1,done:{},loads:{},reps:{},body:[{date:localDateKey(),kg:92}],water:{},meals:{},sleep:{},tasks:{},schedule:{wake:'05:00',gym:'06:00',work:'08:00',lunch:'13:00',finish:'17:00',bed:'22:30'},custom:[],reminders:false,seconds:90,substitutions:{},profileName:'Giancarlo',foodLog:[],exerciseFeelings:{},exerciseFeelingNames:{},gymVisits:{},mealAdjustments:{},cardio:{},closedDays:{},dayHistory:[]};let S;try{S={...defaults,...JSON.parse(localStorage.getItem('mgp-v2')||'{}')}}catch{S={...defaults}}let timer=null,seconds=S.seconds,playing=false,selectedDate=localDateKey(),calendarDate=new Date(),progressTab='peso';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('mgp-v2',JSON.stringify(S))}function dkey(i){return selectedDate+'-'+i}function wk(i){return S.week+'-'+S.day+'-'+i}function chosenExercise(i){const archived=workoutClosure()?.exercises.find(e=>e.slot===i);if(archived&&exerciseGuide[archived.name])return archived.name;const original=plan[S.day].ex[i][0], choice=S.substitutions?.[wk(i)];return exerciseGuide[original]?.variants.includes(choice)?choice:original}function completed(day){const archived=workoutClosure(S.week,day);if(archived)return archived.exercises.filter(e=>e.done).length;return plan[day].ex.filter((_,i)=>S.done[S.week+'-'+day+'-'+i]).length}function dayDone(day){return plan[day].ex.length>0&&completed(day)===plan[day].ex.length}function percent(n,max){return '<div class="progress"><div style="width:'+Math.min(100,Math.round(100*n/(max||1)))+'%"></div></div>'}const iconPaths={walk:'M13 5a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm-2 2 4 2 3 4M11 7l-4 5H4m7-5-2 7 4 3 1 5m-5-8-3 8',run:'M16 5a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm-5 3 4-1 3 4 3-1M11 8l-4 4H4m7-4-2 7 4 2-2 5m-2-7-4 3-3-1',bike:'M6 21a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm13 0a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM6 17l5-9 8 9M6 17h9l-4-9m-3 0h5m3-4h3l-2 4',food:'M5 3v6m3-6v6m3-6v6M5 9h6m-3 0v12M19 3v18m0-18c-4 3-4 8 0 8',home:'M3 10 12 3l9 7v10H6V10m3 10v-7h6v7',calendar:'M5 5h14v16H5zM8 3v4m8-4v4M5 10h14m-10 4h2m3 0h2m-7 3h2',dumbbell:'m4 9 5-5m6 16 5-5M3 6l3-3m12 18 3-3M7 7l10 10M2 10l8-8m4 20 8-8',drop:'M12 3S5 10 5 15a7 7 0 0 0 14 0c0-5-7-12-7-12Zm-3 13a3 3 0 0 0 3 3',chart:'M4 3v17h17M8 16v-5m5 5V6m5 10v-8',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8ZM4 4l3 1 2-2h6l2 2 3-1 1 4-2 2v4l2 2-1 4-3-1-2 2H9l-2-2-3 1-1-4 2-2v-4L3 8Z',moon:'M20 15A8 8 0 0 1 9 4a9 9 0 1 0 11 11Z',weight:'M5 7h14l2 14H3L5 7ZM9 7V5a3 3 0 0 1 6 0v2',arrow:'M4 12h16m-6-6 6 6-6 6',check:'m5 12 4 4L19 6'};
function uiIcon(id){return '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+iconPaths[id]+'"/></svg>'}
function nav(){const activeTab=S.tab==='habitos'?'comidas':S.tab==='bienestar'?'mas':S.tab;let a=[['inicio','home','Inicio'],['dia','calendar','Mi Día'],['rutina','dumbbell','Rutinas'],['comidas','food','Comidas'],['progreso','chart','Progreso'],['mas','settings','Más']];$('#nav').innerHTML=a.map(([id,ico,t])=>'<button class="'+(activeTab===id?'active':'')+'" data-tab="'+id+'" '+(activeTab===id?'aria-current="page"':'')+'><span>'+uiIcon(ico)+'</span>'+t+'</button>').join('');$('#profileAvatar').textContent=(String(S.profileName||'Giancarlo').trim()[0]||'G').toUpperCase()}

function dailyTasks(date=selectedDate,state=S){return dailyActivityItems(date,state).map(t=>[t.id,t.time,t.name])}function renderHome(){
 const total=plan.reduce((n,p,i)=>n+(dayDone(i)?1:0),0),latest=S.body.at(-1)?.kg||92,name=String(S.profileName||'Giancarlo').trim(),today=(new Date().getDay()+6)%7,p=plan[today],done=completed(today),date=new Intl.DateTimeFormat('es-PE',{weekday:'long',day:'numeric',month:'long'}).format(new Date());
 const stats=[['dumbbell','Días entrenados',total+'<small> / 6</small>','Cada sesión cuenta'],['weight','Peso actual',latest+'<small> kg</small>','Tu último registro'],['drop','Agua hoy',((S.water[localDateKey()]||0)/1000).toFixed(2)+'<small> L</small>','Objetivo diario: 2.5 L'],['moon','Descanso',(S.sleep[localDateKey()]||'—')+'<small> h</small>','Recuperar también es avanzar']];
 return '<div class="welcome"><p class="eyebrow">'+esc(date)+'</p><h1>Hola, '+esc(name)+'<span class="welcome-dot">.</span></h1><p class="home-discipline">'+esc(disciplineQuote())+'</p></div><div class="card hero">'+(p.ex.length?'<img class="hero-photo" src="'+esc(exercisePhotos[p.ex[0][0]].images[0])+'" alt="" aria-hidden="true">':'')+'<div class="hero-content"><span class="pill">'+uiIcon('dumbbell')+' SEMANA '+S.week+' · ARNOLD + PPL</span><p class="hero-eyebrow">'+(p.ex.length?'TU ENTRENAMIENTO DE HOY':'HOY TOCA RECUPERAR')+'</p><h2>'+esc(p.title)+'</h2><p class="hero-muscle">'+esc(p.muscle)+'</p><button class="btn" data-recommend-tab="rutina" data-recommend-day="'+today+'" data-recommend-date="'+localDateKey()+'">'+(p.ex.length?'Vamos a entrenar':'Ver mi semana')+uiIcon('arrow')+'</button><p class="hero-footnote">'+(p.ex.length?done+' de '+p.ex.length+' ejercicios completados':'Dale a tu cuerpo el descanso que merece')+'</p></div></div>'+renderDailyRecommendations(S)+'<div class="card weekly-shortcut"><span class="daily-icon">'+uiIcon('chart')+'</span><div><p class="eyebrow">TU PROGRESO</p><h3>Tu semana, de un vistazo</h3><p>Visitas al gym, peso y registros de fuerza.</p><button class="text-link" data-tab="progreso" data-progress="resumen" data-action="openWeekly">Abrir resumen '+uiIcon('arrow')+'</button></div></div><div class="section-heading"><h2>Tu resumen</h2><span class="subtle-tag">PASO A PASO</span></div><div class="grid summary-grid">'+stats.map(([icon,label,value,note])=>'<div class="stat"><span class="stat-icon">'+uiIcon(icon)+'</span><span class="muted small">'+label+'</span><strong>'+value+'</strong><span class="stat-note">'+note+'</span></div>').join('')+'</div><div class="section-heading"><h2>Tu día</h2><button class="text-link" data-tab="dia">Ver todo '+uiIcon('arrow')+'</button></div><div class="card agenda">'+dayActivitySummary(localDateKey()).items.slice(0,7).map(item=>'<div class="item row"><span class="agenda-activity-icon">'+uiIcon(item.kin }

function renderDay(){return renderSimpleDay()}
function renderRoutine(){let p=plan[S.day];return '<h2>Tus rutinas</h2><p class="section-subtitle">Tu entrenamiento, organizado por músculos.</p><div class="card"><div class="row"><button class="btn secondary" aria-label="Semana anterior" data-action="prevWeek">←</button><b>Semana '+S.week+'</b><button class="btn secondary" aria-label="Semana siguiente" data-action="nextWeek">→</button></div><p class="hint">Push / Pull / Legs, repetido dos veces por semana. Ajusta cargas y descansos a tu nivel.</p><div class="days">'+plan.map((x,i)=>'<button class="'+(i===S.day?'active':'')+'" data-day="'+i+'" aria-label="'+esc(x.day)+'" aria-pressed="'+(i===S.day)+'">'+['L','M','M','J','V','S','D'][i]+'</button>').join('')+'</div></div><div class="card routine-summary"><p class="eyebrow">'+esc(p.day)+' · SEMANA '+S.week+'</p><h2>'+esc(p.title)+'</h2><p class="muted">'+esc(workoutSectors(S.day).map(g=>g.name).join(' · ')||p.muscle)+'</p>'+percent(completed(S.day),p.ex.length||1)+'<p class="small muted">'+completed(S.day)+' / '+p.ex.length+' ejercicios completados</p></div>'+renderWorkoutCombination()+renderWorkoutSectors()+'<div class="card"><h3>Descanso entre series</h3><div class="timer" id="clock">'+formatTimer(seconds)+'</div><div class="row"><button class="btn secondary" data-action="minus">−30 s</button><button class="btn" data-action="timer">'+(playing?'Pausar':'Iniciar')+'</button><button class="btn secondary" data-action="plus">+30 s</button></div></div>'+renderCardioFinish()+renderDayClosePanel()}
function renderWellbeing(){const archive=closedDay(selectedDate);let w=archive?archive.water:S.water[selectedDate]||0,sl=archive?(archive.sleep??''):(S.sleep[selectedDate]||'');return '<h2>Agua y descanso</h2><div class="card"><label class="label">Fecha</label><input type="date" class="field" data-field="date" value="'+selectedDate+'"></div><div class="card"><h3>Agua · '+(w/1000).toFixed(2)+' / 2.5 L</h3>'+percent(w,2500)+'<p class="row"><button class="btn" data-action="water">+ 250 ml</button><button class="btn secondary" data-action="waterMinus">− 250 ml</button></p></div><div class="card"><h3>Sueño</h3><label class="label">Horas dormidas</label><input class="field" type="number" min="0" max="24" step="0.5" data-sleep value="'+esc(sl)+'" placeholder="Ej. 7.5"></div>'}

function renderMore(){
 const name=String(S.profileName||'Giancarlo'),initial=name.trim()[0]||'G';
 const row=(icon,title,description,attribute)=>'<button class="settings-row" '+attribute+'><span class="settings-icon">'+uiIcon(icon)+'</span><span class="settings-row-copy"><b>'+title+'</b><small>'+description+'</small></span><span class="settings-chevron" aria-hidden="true">›</span></button>';

settings-icon">'+uiIcon('calendar')+'</span><label class="settings-row-copy" for="reminderPreference"><b>Preparar recordatorios</b><small>Guardar mi preferencia</small></label><input class="settings-switch" id="reminderPreference" role="switch" type="checkbox" data-reminders '+(S.reminders?'checked':'')+'></div><p class="settings-inline-note">Las notificaciones automáticas todavía no están disponibles. Puedes consultar tus tareas en Mi Día.</p></div><p class="settings-group-title">TUS DATOS</p><div class="settings-group">'+row('chart','Guardar una copia','Exporta tus registros para protegerlos','data-action="export"')+'<label class="settings-row settings-import" for="restore"><span class="settings-icon">'+uiIcon('arrow')+'</span><span class="settings-row-copy"><b>Restaurar una copia</b><small>Elige tu archivo de respaldo JSON</small></span><span class="settings-chevron" aria-hidden="true">›</span><input type="file" id="restore" aria-label="Restaurar una copia de seguridad" accept=".json,application/json" class="settings-file"></label><div class="settings-data-note">'+uiIcon('check')+'<span>Tus datos se guardan en este navegador. Restaurar una copia reemplaza los registros actuales después de tu confirmación.</span></div></div><div class="settings-footer"><span class="brand-mark" aria-hidden="true">✦</span><b>Mi Gym Planner</b><span>Tu constancia, tu progreso.</span></div>';
