<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111d"><title>Mi Gym Planner</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#eaf2ff;background:#07111d}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:650px;margin:auto;padding:18px 16px 100px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.head b{font-size:20px}.blue{color:#3c9bff}.muted{color:#9baec3}.small{font-size:12px}.card{background:#102033;border:1px solid #263d55;border-radius:18px;padding:16px;margin:12px 0}.hero{background:linear-gradient(130deg,#103b67,#102033);padding:22px}.hero h1{margin:8px 0;font-size:27px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#14283d;padding:14px;border-radius:14px}.stat strong{display:block;font-size:24px;margin-top:5px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.btn{background:#187af0;color:white;border:0;border-radius:12px;padding:11px 14px;font-weight:750}.btn.secondary{background:#233c56}.btn:disabled{opacity:.45}.field{background:#091728;color:white;border:1px solid #3c5268;border-radius:10px;padding:10px;max-width:100%;width:100%}.label{font-size:12px;color:#b4c6d9;display:block;margin:10px 0 5px}.nav{position:fixed;bottom:0;left:0;right:0;background:#0b1929;border-top:1px solid #263b52;display:flex;justify-content:center;padding:8px 3px calc(8px + env(safe-area-inset-bottom))}.nav>div{max-width:650px;width:100%;display:flex;justify-content:space-around}.nav button{border:0;background:transparent;color:#8fa5ba;font-size:11px;padding:6px 2px;min-width:54px}.nav button.active{color:#58a7ff;font-weight:800}.nav span{display:block;font-size:20px}.item{padding:12px 0;border-bottom:1px solid #294057}.item:last-child{border:0}.item input[type=checkbox]{width:21px;height:21px;accent-color:#23c894;flex-shrink:0}.item label{display:flex;align-items:center;gap:10px;flex:1}.pill{font-size:11px;padding:5px 9px;background:#25425e;border-radius:15px;color:#9bd0ff}.progress{height:8px;background:#294059;border-radius:10px;overflow:hidden}.progress div{height:100%;background:#28c999}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.days button{padding:10px 0;background:#1b3148;border:1px solid #36506b;color:#eaf2ff;border-radius:10px;font-weight:700}.days button.active{background:#187af0}.month{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.month button{border:1px solid #30445a;background:#13253a;color:#eaf2ff;border-radius:9px;aspect-ratio:1}.month button.active{border:2px solid #55a9ff}.month button.mark{background:#16513f}.barrow{display:flex;align-items:end;gap:6px;height:130px;padding-top:15px}.barrow div{flex:1;background:#2786ef;border-radius:5px 5px 0 0;min-height:3px}.tabline{display:flex;gap:7px;overflow:auto}.tabline button{border:0;border-radius:10px;background:#21364d;color:#b4c8dc;padding:9px 12px;white-space:nowrap}.tabline button.active{background:#187af0;color:white}h2{font-size:21px;margin:18px 0 10px}h3{font-size:16px;margin:8px 0}p{line-height:1.5}.timer{font-size:48px;font-weight:850;text-align:center;letter-spacing:2px;padding:18px}.hint{font-size:12px;color:#92a7bb;line-height:1.6}svg{max-width:100%}

.exercise-open{background:none;border:0;color:#eaf2ff;text-align:left;padding:10px 0;flex:1;min-height:44px}.exercise-open b{color:#9bd0ff}.exercise-open:focus-visible,.guide-close:focus-visible{outline:2px solid #58a7ff;outline-offset:3px}
.exercise-check{min-width:32px;min-height:44px!important}.exercise-dialog{background:#102033;color:#eaf2ff;border:1px solid #3c5268;border-radius:20px;width:calc(100% - 24px);max-width:600px;max-height:calc(100dvh - 24px);padding:18px 18px calc(18px + env(safe-area-inset-bottom));overflow:auto;overscroll-behavior:contain}.exercise-dialog::backdrop{background:rgba(2,8,16,.8)}.guide-head{position:sticky;top:-18px;background:#102033;z-index:1;padding:10px 0;display:flex;align-items:center;gap:12px;justify-content:space-between}.guide-head h2{margin:0;font-size:20px}.guide-close{min-width:44px;min-height:44px;border:0;border-radius:12px;background:#233c56;color:white;font-size:24px}.exercise-dialog li{line-height:1.6;margin:10px 0}.guide-art{background:#091728;border-radius:14px;margin:12px 0}.variant-option{padding:14px 0;border-top:1px solid #294057}.variant-option .btn{margin-top:10px;width:100%;min-height:44px}.guide-note{font-size:13px;color:#b4c6d9;line-height:1.6}
</style></head><body><div class="app"><div class="head"><b>🏋️ Mi <span class="blue">Gym</span> Planner</b><span class="pill">ARNOLD + PPL</span></div><main id="root"></main></div><nav class="nav"><div id="nav"></div></nav><script src="exercises.js"></script><script>
const plan=[{day:'Lunes',title:'Push A',muscle:'Pecho · hombros · tríceps',ex:[['Press de banca','3 × 8–10'],['Press inclinado mancuernas','3 × 10–12'],['Press militar','3 × 8–10'],['Elevaciones laterales','3 × 12–15'],['Tríceps en polea','3 × 12']]},{day:'Martes',title:'Pull A',muscle:'Espalda · bíceps',ex:[['Jalón al pecho','3 × 10'],['Remo sentado','3 × 10'],['Face pull','3 × 12–15'],['Curl bíceps','3 × 10–12'],['Curl martillo','2 × 12']]},{day:'Miércoles',title:'Legs A',muscle:'Cuádriceps · femorales · core',ex:[['Sentadilla goblet','3 × 10'],['Prensa de piernas','3 × 12'],['Peso muerto rumano','3 × 10'],['Curl femoral','3 × 12'],['Plancha','3 × 30 s']]},{day:'Jueves',title:'Push B',muscle:'Pecho · hombros · tríceps',ex:[['Press inclinado','3 × 10'],['Aperturas','3 × 12'],['Press hombros mancuernas','3 × 10'],['Elevación lateral','3 × 15'],['Extensión tríceps','3 × 12']]},{day:'Viernes',title:'Pull B',muscle:'Espalda · bíceps',ex:[['Remo con mancuerna','3 × 10'],['Jalón agarre neutro','3 × 12'],['Pájaros posteriores','3 × 12'],['Curl barra','3 × 10'],['Curl concentrado','2 × 12']]},{day:'Sábado',title:'Legs B',muscle:'Piernas · glúteos · core',ex:[['Peso muerto rumano','3 × 10'],['Zancadas','3 × 10'],['Extensión cuádriceps','3 × 12'],['Elevación talones','3 × 15'],['Crunch','3 × 15']]},{day:'Domingo',title:'Descanso',muscle:'Recuperación',ex:[]}];
const defaults={tab:'inicio',day:(new Date().getDay()+6)%7,week:1,done:{},loads:{},reps:{},body:[{date:new Date().toISOString().slice(0,10),kg:92}],water:{},meals:{},sleep:{},tasks:{},schedule:{wake:'05:00',gym:'06:00',work:'08:00',lunch:'13:00',finish:'17:00',bed:'22:30'},custom:[],reminders:false,seconds:90,substitutions:{}};let S;try{S={...defaults,...JSON.parse(localStorage.getItem('mgp-v2')||'{}')}}catch{S={...defaults}}let timer=null,seconds=S.seconds,playing=false,selectedDate=new Date().toISOString().slice(0,10),calendarDate=new Date(),progressTab='peso';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('mgp-v2',JSON.stringify(S))}function dkey(i){return selectedDate+'-'+i}function wk(i){return S.week+'-'+S.day+'-'+i}function chosenExercise(i){const original=plan[S.day].ex[i][0], choice=S.substitutions?.[wk(i)];return exerciseGuide[original]?.variants.includes(choice)?choice:original}function completed(day){return plan[day].ex.filter((_,i)=>S.done[S.week+'-'+day+'-'+i]).length}function dayDone(day){return plan[day].ex.length>0&&completed(day)===plan[day].ex.length}function percent(n,max){return '<div class="progress"><div style="width:'+Math.min(100,Math.round(100*n/(max||1)))+'%"></div></div>'}function nav(){let a=[['inicio','⌂','Inicio'],['dia','▦','Mi Día'],['rutina','🏋','Rutinas'],['habitos','◉','Hábitos'],['progreso','▥','Progreso'],['mas','⚙','Más']];$('#nav').innerHTML=a.map(([id,ico,t])=>'<button class="'+(S.tab===id?'active':'')+'" data-tab="'+id+'"><span>'+ico+'</span>'+t+'</button>').join('')}
function dailyTasks(){let a=[['wake',S.schedule.wake,'Despertar y tomar agua'],['bath','05:10','Aseo personal'],['leave','05:50','Salir al gimnasio'],['gym',S.schedule.gym,'Entrenamiento '+plan[S.day].title],['shower','06:50','Ducha y desayuno'],['work',S.schedule.work,'Inicio del trabajo'],['lunch',S.schedule.lunch,'Almuerzo'],['finish',S.schedule.finish,'Fin del trabajo'],['dinner','19:00','Cena'],['bed',S.schedule.bed,'Prepararme para dormir']];return [...a,...S.custom].sort((x,y)=>x[1].localeCompare(y[1]))}function renderHome(){let total=plan.reduce((n,p,i)=>n+(dayDone(i)?1:0),0),latest=S.body.at(-1)?.kg||92;return '<div class="card hero"><span class="pill">SEMANA '+S.week+'</span><h1>¡Vamos con todo! 💪</h1><p>Hoy: '+plan[S.day].title+' · '+plan[S.day].muscle+'</p><button class="btn" data-tab="rutina">Iniciar entrenamiento →</button></div><div class="grid"><div class="stat"><span class="muted small">Días entrenados</span><strong>'+total+'/6</strong></div><div class="stat"><span class="muted small">Peso actual</span><strong>'+latest+' kg</strong></div><div class="stat"><span class="muted small">Agua hoy</span><strong>'+((S.water[selectedDate]||0)/1000).toFixed(2)+' L</strong></div><div class="stat"><span class="muted small">Sueño</span><strong>'+(S.sleep[selectedDate]||'—')+' h</strong></div></div><h2>Tu día</h2><div class="card">'+dailyTasks().slice(0,5).map(([id,t,n])=>'<div class="item row"><span class="blue">'+t+'</span><span>'+n+'</span><span>'+(S.tasks[dkey(id)]?'✓':'○')+'</span></div>').join('')+'<p><button class="btn secondary" data-tab="dia">Abrir Mi Día</button></p></div>'}
function renderDay(){let tasks=dailyTasks(),count=tasks.filter(t=>S.tasks[dkey(t[0])]).length;return '<h2>📅 Mi Día</h2><div class="card"><label class="label">Fecha</label><input class="field" type="date" data-field="date" value="'+selectedDate+'"><p>'+count+' de '+tasks.length+' actividades completadas</p>'+percent(count,tasks.length)+'</div><div class="card">'+tasks.map(([id,t,n])=>'<div class="item row"><label><input type="checkbox" data-task="'+id+'" '+(S.tasks[dkey(id)]?'checked':'')+'><span><span class="blue small">'+t+'</span><br>'+esc(n)+'</span></label>'+(id.startsWith('custom')?'<button class="btn secondary" data-delete="'+id+'">×</button>':'')+'</div>').join('')+'</div><div class="card"><h3>Agregar actividad</h3><label class="label">Hora</label><input class="field" type="time" id="taskTime" value="18:00"><label class="label">Nombre</label><input class="field" id="taskName" placeholder="Ej. Preparar cena"><p><button class="btn" data-action="addTask">+ Agregar</button></p></div>'}
function renderRoutine(){let p=plan[S.day];return '<h2>🏋️ Arnold Split + PPL</h2><div class="card"><div class="row"><button class="btn secondary" data-action="prevWeek">←</button><b>Semana '+S.week+'</b><button class="btn secondary" data-action="nextWeek">→</button></div><p class="hint">Push / Pull / Legs, repetido dos veces por semana. Ajusta cargas y descansos a tu nivel.</p><div class="days">'+plan.map((x,i)=>'<button class="'+(i===S.day?'active':'')+'" data-day="'+i+'">'+['L','M','M','J','V','S','D'][i]+'</button>').join('')+'</div></div><div class="card"><h2>'+p.title+'</h2><p class="muted">'+p.muscle+'</p>'+percent(completed(S.day),p.ex.length||1)+'<p class="small muted">'+completed(S.day)+' / '+p.ex.length+' ejercicios completados</p>'+(p.ex.length?p.ex.map(([name,sets],i)=>'<div class="item"><div class="row"><input class="exercise-check" aria-label="Completar '+esc(chosenExercise(i))+'" type="checkbox" data-ex="'+i+'" '+(S.done[wk(i)]?'checked':'')+'><button class="exercise-open" data-guide="'+i+'" aria-haspopup="dialog"><b>'+esc(chosenExercise(i))+'</b><br><span class="small muted">'+sets+' · Ver técnica →</span></button></div><div class="row" style="margin-top:8px;padding-left:31px"><span class="small muted">Peso (kg)</span><input style="max-width:90px" class="field" type="number" min="0" step="0.5" data-load="'+i+'" placeholder="0" value="'+esc(S.loads[wk(i)]||'')+'"><span class="small muted">Reps</span><input style="max-width:75px" class="field" type="number" min="0" data-reps="'+i+'" placeholder="10" value="'+esc(S.reps[wk(i)]||'')+'"></div></div>').join(''):'<p>Descansa y recupérate.</p>')+'</div><div class="card"><h3>⏱ Descanso entre series</h3><div class="timer" id="clock">'+formatTimer(seconds)+'</div><div class="row"><button class="btn secondary" data-action="minus">−30 s</button><button class="btn" data-action="timer">'+(playing?'Pausar':'Iniciar')+'</button><button class="btn secondary" data-action="plus">+30 s</button></div></div>'}
function renderHabits(){let w=S.water[selectedDate]||0,meals=S.meals[selectedDate]||{},sl=S.sleep[selectedDate]||'';return '<h2>💧 Mis hábitos</h2><div class="card"><label class="label">Fecha</label><input type="date" class="field" data-field="date" value="'+selectedDate+'"></div><div class="card"><h3>Agua · '+(w/1000).toFixed(2)+' / 2.5 L</h3>'+percent(w,2500)+'<p class="row"><button class="btn" data-action="water">+ 250 ml</button><button class="btn secondary" data-action="waterMinus">− 250 ml</button></p></div><div class="card"><h3>🍽 Alimentación</h3>'+['Desayuno','Almuerzo','Cena','Snack'].map((m,i)=>'<div class="item"><label><input type="checkbox" data-meal="'+i+'" '+(meals[i]?'checked':'')+'>'+m+'</label></div>').join('')+'</div><div class="card"><h3>🌙 Sueño</h3><label class="label">Horas dormidas</label><input class="field" type="number" min="0" max="24" step="0.5" data-sleep value="'+esc(sl)+'" placeholder="Ej. 7.5"></div>'}
function renderProgress(){let data=S.body,latest=data.at(-1)?.kg||92;return '<h2>📊 Mi progreso</h2><div class="grid"><div class="stat"><span class="muted small">Peso actual</span><strong>'+latest+' kg</strong></div><div class="stat"><span class="muted small">Objetivo</span><strong>78 kg</strong></div></div><div class="card"><h3>Registrar peso</h3><div class="row"><input id="newWeight" type="number" class="field" step="0.1" min="20" placeholder="Peso (kg)"><button class="btn" data-action="addWeight">Guardar</button></div></div><div class="card"><div class="tabline"><button class="'+(progressTab==='peso'?'active':'')+'" data-progress="peso">Peso</button><button class="'+(progressTab==='entrenos'?'active':'')+'" data-progress="entrenos">Entrenos</button><button class="'+(progressTab==='habitos'?'active':'')+'" data-progress="habitos">Hábitos</button></div>'+(progressTab==='peso'?'<h3>Evolución del peso</h3><div class="barrow">'+data.slice(-12).map(x=>'<div title="'+x.kg+' kg" style="height:'+Math.max(8,Math.min(100,(x.kg/110)*100))+'%"></div>').join('')+'</div><p class="hint">'+data.map(x=>esc(x.date)+': '+x.kg+' kg').join(' · ')+'</p>':progressTab==='entrenos'?'<h3>Esta semana</h3><div class="barrow">'+plan.map((p,i)=>'<div style="height:'+Math.max(4,(completed(i)/(p.ex.length||1))*100)+'%"></div>').join('')+'</div><p class="hint">L · M · M · J · V · S · D</p>':'<h3>Agua últimos 7 registros</h3><div class="barrow">'+Object.entries(S.water).slice(-7).map(([k,v])=>'<div title="'+k+'" style="height:'+Math.max(4,Math.min(100,v/25))+'%"></div>').join('')+'</div>')+'</div>'}
function renderCalendar(){let y=calendarDate.getFullYear(),m=calendarDate.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),cells=Array(first).fill(null).concat(Array.from({length:days},(_,i)=>i+1));return '<h2>🗓 Calendario mensual</h2><div class="card"><div class="row"><button class="btn secondary" data-action="prevMonth">←</button><b>'+new Intl.DateTimeFormat('es-PE',{month:'long',year:'numeric'}).format(calendarDate)+'</b><button class="btn secondary" data-action="nextMonth">→</button></div><div class="days" style="margin:15px 0 7px">'+['L','M','M','J','V','S','D'].map(d=>'<span style="text-align:center">'+d+'</span>').join('')+'</div><div class="month">'+cells.map(d=>d?'<button class="'+(selectedDate===y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')?'active':'')+' '+(Object.keys(S.tasks).some(k=>k.startsWith(y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'))&&S.tasks[k])?'mark':'')+'" data-date="'+y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')+'">'+d+'</button>':'<span></span>').join('')+'</div></div><p class="hint">Toca un día para abrir su planificación. Verde indica que registraste actividades.</p>'}
function renderMore(){return '<h2>⚙ Configuración</h2><div class="card"><h3>Horarios automáticos</h3><p class="hint">Los horarios base se repiten cada día. Puedes personalizarlos aquí.</p>'+[['wake','Despertar'],['gym','Gimnasio'],['work','Trabajo'],['lunch','Almuerzo'],['finish','Salida del trabajo'],['bed','Dormir']].map(([k,t])=>'<label class="label">'+t+'</label><input class="field" type="time" data-schedule="'+k+'" value="'+S.schedule[k]+'">').join('')+'</div><div class="card"><h3>🔔 Recordatorios</h3><p class="hint">En esta versión puedes ver tus tareas dentro de Mi Día. Las notificaciones automáticas aún no están habilitadas; requieren permisos y configuración adicional.</p><label><input type="checkbox" data-reminders '+(S.reminders?'checked':'')+'> Preparar recordatorios (preferencia)</label></div><div class="card"><h3>Calendario</h3><button class="btn secondary" data-tab="calendario">Abrir calendario mensual</button></div><div class="card"><h3>Respaldo de datos</h3><p class="hint">Los datos están guardados solamente en este navegador. Exporta una copia para protegerlos.</p><button class="btn secondary" data-action="export">Exportar JSON</button><label class="label">Restaurar respaldo</label><input type="file" id="restore" accept=".json,application/json" class="field"></div>'}
function formatTimer(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}function render(){nav();$('#root').innerHTML=({inicio:renderHome,dia:renderDay,rutina:renderRoutine,habitos:renderHabits,progreso:renderProgress,calendario:renderCalendar,mas:renderMore}[S.tab]||renderHome)()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-tab],[data-day],[data-date],[data-action],[data-progress],[data-delete]');if(!b)return;if(b.dataset.tab)S.tab=b.dataset.tab;if(b.dataset.day!==undefined)S.day=+b.dataset.day;if(b.dataset.date){selectedDate=b.dataset.date;S.tab='dia'}if(b.dataset.progress)progressTab=b.dataset.progress;if(b.dataset.delete)S.custom=S.custom.filter(x=>x[0]!==b.dataset.delete);let a=b.dataset.action;if(a==='prevWeek')S.week=Math.max(1,S.week-1);if(a==='nextWeek')S.week++;if(a==='prevMonth')calendarDate=new Date(calendarDate.getFullYear(),calendarDate.getMonth()-1,1);if(a==='nextMonth')calendarDate=new Date(calendarDate.getFullYear(),calendarDate.getMonth()+1,1);if(a==='water')S.water[selectedDate]=(S.water[selectedDate]||0)+250;if(a==='waterMinus')S.water[selectedDate]=Math.max(0,(S.water[selectedDate]||0)-250);if(a==='addTask'){let name=$('#taskName').value.trim(),t=$('#taskTime').value;if(name&&t)S.custom.push(['custom'+Date.now(),t,name]);else alert('Ingresa hora y actividad')}if(a==='addWeight'){let v=+$('#newWeight').value;if(v>20&&v<400)S.body.push({date:new Date().toISOString().slice(0,10),kg:v});else alert('Ingresa un peso válido')}if(a==='minus')seconds=Math.max(0,seconds-30);if(a==='plus')seconds+=30;if(a==='timer'){playing=!playing;if(playing){timer=setInterval(()=>{seconds=Math.max(0,seconds-1);let c=$('#clock');if(c)c.textContent=formatTimer(seconds);if(seconds===0){clearInterval(timer);playing=false;render()}},1000)}else clearInterval(timer)}if(a==='export'){let url=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'})),link=document.createElement('a');link.href=url;link.download='mi-gym-planner-respaldo.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}save();render()});
document.addEventListener('change',async e=>{let t=e.target;if(t.dataset.task)S.tasks[dkey(t.dataset.task)]=t.checked;if(t.dataset.ex!==undefined)S.done[wk(+t.dataset.ex)]=t.checked;if(t.dataset.meal!==undefined){S.meals[selectedDate]??={};S.meals[selectedDate][t.dataset.meal]=t.checked}if(t.dataset.sleep!==undefined)S.sleep[selectedDate]=t.value;if(t.dataset.load!==undefined)S.loads[wk(+t.dataset.load)]=t.value;if(t.dataset.reps!==undefined)S.reps[wk(+t.dataset.reps)]=t.value;if(t.dataset.schedule)S.schedule[t.dataset.schedule]=t.value;if(t.dataset.field==='date')selectedDate=t.value;if(t.dataset.reminders!==undefined)S.reminders=t.checked;if(t.id==='restore'&&t.files[0]){try{let data=JSON.parse(await t.files[0].text());if(data&&data.done&&data.schedule&&confirm('¿Restaurar los datos del respaldo?'))S={...defaults,...data}}catch{alert('Respaldo inválido')}}save();render()});document.addEventListener('input',e=>{let t=e.target;if(t.dataset.load!==undefined){S.loads[wk(+t.dataset.load)]=t.value;save()}if(t.dataset.reps!==undefined){S.reps[wk(+t.dataset.reps)]=t.value;save()}});render();
</script><script src="exercise-dialog.js"></script></body></html>
